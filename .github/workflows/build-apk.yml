name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.personalinfo.bank",
            "appName": "بنك المعلومات الشخصية",
            "webDir": "www"
          }
          JSON
          npx cap add android

      - name: App icon
        run: |
          mkdir assets
          cp icon.png assets/icon-only.png
          npm i -D @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#075846' --iconBackgroundColorDark '#075846' || echo "icon step skipped"

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PersonalInfoBank.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: PersonalInfoBank.apk
